<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bakery Order</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="language-selector">
      <button class="lang-btn" data-lang="hu" title="Hungarian">
        <img src="https://flagcdn.com/w20/hu.png" alt="Hungarian" />
      </button>
      <button class="lang-btn" data-lang="sr" title="Serbian">
        <img src="https://flagcdn.com/w20/rs.png" alt="Serbian" />
      </button>
      <button class="lang-btn active" data-lang="en" title="English">
        <img src="https://flagcdn.com/w20/gb.png" alt="English" />
      </button>
    </div>

    <div class="logo-container">
      <img src="logo.png" alt="Bakery Logo" class="logo" />
    </div>

    <h2 data-translate="pageTitle">Bakery Order Form</h2>

    <div id="ordersStatus" class="orders-status hidden"></div>

    <form id="orderForm">
      <label>
        <span data-translate="firstName">First name</span>
        <input type="text" id="firstName" required />
      </label>

      <label>
        <span data-translate="lastName">Last name</span>
        <input type="text" id="lastName" required />
      </label>

      <label>
        <span data-translate="phoneNumber">Phone number</span>
        <input type="tel" id="phone" required />
      </label>

      <label>
        <span data-translate="emailOptional">Email (optional)</span>
        <input type="email" id="email" />
      </label>

      <label>
        <span data-translate="location">Location</span>
        <select id="location" required>
          <option value="" data-translate="selectLocation">
            Select location
          </option>
          <option value="subotica" data-translate="subotica">Subotica</option>
          <option value="hajdukovo" data-translate="hajdukovo">
            Hajdukovo
          </option>
        </select>
      </label>

      <h3 data-translate="orderedBread">Ordered bread</h3>

      <div id="loadingSpinner" class="loading-spinner">
        <div class="spinner"></div>
      </div>

      <div id="items" class="hidden"></div>

      <button type="button" class="add-article" onclick="addItem()">
        <span data-translate="addBread">➕ Add bread</span>
      </button>

      <div class="total">
        <span data-translate="totalPrice">Total price:</span>
        <span id="totalPrice">0</span>
        <span data-translate="currency">RSD</span>
      </div>

      <label>
        <span data-translate="remarkOptional">Remark (optional)</span>
        <textarea
          id="remark"
          rows="3"
          data-translate-placeholder="remarkPlaceholder"
        ></textarea>
      </label>

      <button
        type="submit"
        style="margin-top: 1rem"
        data-translate="submitOrder"
      >
        Submit order
      </button>

      <div id="result" class="success"></div>
    </form>

    <div
      id="confirmationModal"
      class="modal-overlay"
      onclick="if(event.target === this) closeModal()"
    >
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title" data-translate="confirmOrder">
            Confirm Order
          </h3>
          <button type="button" class="modal-close" onclick="closeModal()">
            ✕
          </button>
        </div>
        <div class="modal-content" id="modalContent"></div>
        <div class="modal-footer">
          <div id="modalFooterButtons">
            <button
              type="button"
              class="modal-btn modal-btn-secondary"
              onclick="closeModal()"
              data-translate="cancel"
            >
              Cancel
            </button>
            <button
              type="button"
              class="modal-btn"
              onclick="confirmOrder()"
              data-translate="confirmOrderBtn"
            >
              Confirm Order
            </button>
          </div>
          <div id="modalFooterSpinner" class="loading-spinner hidden">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="translations.js"></script>
    <script>
      const BREAD_TYPES_URL =
        "https://n8n.aleksthecoder.com/webhook/bread-types";
      const ORDER_SUBMIT_URL =
        "https://n8n.aleksthecoder.com/webhook/bakery-order";

      // Current language (default: English)
      let currentLang = localStorage.getItem("bakery-lang") || "en";

      // Bread types and order acceptance status
      let breadTypes = [
        { id: "white_500", name: "White bread 500g", price: 120 },
        { id: "rye_700", name: "Rye bread 700g", price: 180 },
      ];

      let acceptingOrders = true;

      /**
       * Example fallback data if fetch fails
       */
      const fallbackBreadTypes = [
        { id: "white_500", name: "White bread 500g", price: 120 },
        { id: "rye_700", name: "Rye bread 700g", price: 180 },
      ];

      function updateOrdersStatusDisplay() {
        const statusDiv = document.getElementById("ordersStatus");
        const orderForm = document.getElementById("orderForm");
        
        if (statusDiv) {
          if (acceptingOrders) {
            statusDiv.classList.add("hidden");
          } else {
            statusDiv.classList.remove("hidden");
            const websiteUrl = "https://lisztrapszodia.in.rs/index.html";
            statusDiv.innerHTML = `
              <div>${translations.ordersNotAcceptedFirst[currentLang]} ${translations.ordersNotAcceptedSecond[currentLang]}</div>
              <div style="margin-top: 0.75rem;">
                ${translations.ordersNotAcceptedThirdPrefix[currentLang]} 
                <a href="${websiteUrl}" target="_blank" rel="noopener noreferrer">${translations.ordersNotAcceptedThirdLink[currentLang]}</a>.
              </div>
            `;
          }
        }
        
        if (orderForm) {
          if (acceptingOrders) {
            orderForm.classList.remove("hidden");
          } else {
            orderForm.classList.add("hidden");
          }
        }
      }

      // Function to switch language
      function switchLanguage(lang) {
        currentLang = lang;
        localStorage.setItem("bakery-lang", lang);

        // Update active button
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });

        // Update all elements with data-translate attribute
        document.querySelectorAll("[data-translate]").forEach((el) => {
          const key = el.dataset.translate;
          if (translations[key] && translations[key][lang]) {
            el.textContent = translations[key][lang];
          }
        });

        // Update placeholder attributes
        document
          .querySelectorAll("[data-translate-placeholder]")
          .forEach((el) => {
            const key = el.dataset.translatePlaceholder;
            if (translations[key] && translations[key][lang]) {
              el.placeholder = translations[key][lang];
            }
          });

        // Update orders status display
        updateOrdersStatusDisplay();

        // Update location select options
        const locationSelect = document.getElementById("location");
        if (locationSelect) {
          Array.from(locationSelect.options).forEach((option) => {
            if (
              option.dataset.translate &&
              translations[option.dataset.translate]
            ) {
              option.textContent = translations[option.dataset.translate][lang];
            }
          });
        }

        // Update bread type options in existing items
        document.querySelectorAll("#items .row select").forEach((select) => {
          const selectedValue = select.value;
          select.innerHTML = "";
          breadTypes.forEach((b) => {
            const opt = document.createElement("option");
            opt.value = b.id;
            opt.dataset.price = b.price;
            opt.textContent = `${b.name} (${b.price} ${translations.currency[lang]})`;
            select.appendChild(opt);
          });
          select.value = selectedValue;
        });

        // Update page title
        document.title = translations.pageTitle[lang] || "Bakery Order";

        // Update html lang attribute
        document.documentElement.lang = lang;
      }

      // Initialize language selector buttons
      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          switchLanguage(btn.dataset.lang);
        });
      });

      // Load saved language on page load
      switchLanguage(currentLang);

      // Form element selectors (global variables for DRY principle)
      const firstNameEl = document.getElementById("firstName");
      const lastNameEl = document.getElementById("lastName");
      const phoneEl = document.getElementById("phone");
      const emailEl = document.getElementById("email");
      const locationEl = document.getElementById("location");

      async function loadBreadTypes() {
        try {
          const res = await fetch(BREAD_TYPES_URL);
          const breadTypesResponse = await res.json();
          acceptingOrders = breadTypesResponse?.acceptingOrders ?? true;
          breadTypes = breadTypesResponse?.data ?? breadTypesResponse.data ?? fallbackBreadTypes;
          updateOrdersStatusDisplay();
        } catch {
          acceptingOrders = true;
          breadTypes = fallbackBreadTypes;
          updateOrdersStatusDisplay();
        }
      }

      function addItem() {
        const container = document.getElementById("items");

        const row = document.createElement("div");
        row.className = "row";

        const select = document.createElement("select");
        breadTypes.forEach((b) => {
          const opt = document.createElement("option");
          opt.value = b.id;
          opt.dataset.price = b.price;
          opt.textContent = `${b.name} (${b.price} ${translations.currency[currentLang]})`;
          select.appendChild(opt);
        });

        const qty = document.createElement("input");
        qty.type = "number";
        qty.min = 1;
        qty.value = 1;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "✖";
        remove.className = "remove-btn";
        remove.onclick = () => {
          row.remove();
          calculateTotal();
          updateSubmitButtonState();
        };

        select.onchange = () => {
          calculateTotal();
          updateSubmitButtonState();
        };
        qty.oninput = () => {
          calculateTotal();
          updateSubmitButtonState();
        };

        row.append(select, qty, remove);
        container.appendChild(row);

        calculateTotal();
        updateSubmitButtonState();
      }

      function calculateTotal() {
        let total = 0;

        document.querySelectorAll("#items .row").forEach((row) => {
          const select = row.querySelector("select");
          const qty = row.querySelector("input");
          const price = Number(select.selectedOptions[0].dataset.price);
          total += price * Number(qty.value || 0);
        });

        document.getElementById("totalPrice").textContent = total;
        updateSubmitButtonState();
      }

      function updateSubmitButtonState() {
        const submitBtn = document.querySelector('button[type="submit"]');
        const itemCount = document.querySelectorAll("#items .row").length;
        submitBtn.disabled = itemCount === 0;
      }

      function showConfirmationModal(orderData) {
        const modal = document.getElementById("confirmationModal");
        const content = document.getElementById("modalContent");

        const locationNames = {
          subotica: translations.subotica[currentLang],
          hajdukovo: translations.hajdukovo[currentLang],
        };

        let html = `
          <div style="margin-bottom: 1rem;">
            <strong>${translations.customer[currentLang]}</strong><br>
            ${orderData.customer.firstName} ${orderData.customer.lastName}<br>
            ${orderData.customer.phone}
            ${orderData.customer.email ? `<br>${orderData.customer.email}` : ""}
            ${
              orderData.location
                ? `<br><br><strong>${
                    translations.locationLabel[currentLang]
                  }</strong> ${
                    locationNames[orderData.location] || orderData.location
                  }`
                : ""
            }
          </div>
          <div style="margin-bottom: 1rem;">
            <strong>${translations.orderItems[currentLang]}</strong>
        `;

        orderData.items.forEach((item) => {
          html += `
            <div class="modal-item">
              ${item.breadName} × ${item.quantity} = ${item.total} ${translations.currency[currentLang]}
            </div>
          `;
        });

        html += `
          </div>
          <div style="font-size: 1.2rem; font-weight: 600; text-align: right; padding-top: 1rem; border-top: 2px solid var(--border);">
            ${translations.total[currentLang]}: ${orderData.totalPrice} ${translations.currency[currentLang]}
          </div>
        `;

        content.innerHTML = html;
        modal.classList.add("show");
      }

      function closeModal() {
        document.getElementById("confirmationModal").classList.remove("show");

        // Reset modal footer state
        const modalFooterButtons =
          document.getElementById("modalFooterButtons");
        const modalFooterSpinner =
          document.getElementById("modalFooterSpinner");
        const modalCloseBtn = document.querySelector(".modal-close");

        if (modalFooterButtons && modalFooterSpinner && modalCloseBtn) {
          modalFooterButtons.style.display = "flex";
          modalFooterSpinner.classList.add("hidden");
          modalCloseBtn.disabled = false;
          modalCloseBtn.style.pointerEvents = "auto";
          modalCloseBtn.style.opacity = "1";
        }
      }

      let pendingOrderData = null;

      async function confirmOrder() {
        if (!pendingOrderData) return;

        // Show spinner and hide buttons in modal
        const modalFooterButtons =
          document.getElementById("modalFooterButtons");
        const modalFooterSpinner =
          document.getElementById("modalFooterSpinner");
        const modalCloseBtn = document.querySelector(".modal-close");

        modalFooterButtons.style.display = "none";
        modalFooterSpinner.classList.remove("hidden");
        modalCloseBtn.disabled = true;
        modalCloseBtn.style.pointerEvents = "none";
        modalCloseBtn.style.opacity = "0.5";

        try {
          const res = await fetch(ORDER_SUBMIT_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(pendingOrderData),
          });

          if (res.ok) {
            closeModal();

            // Save user data before resetting
            const savedUserData = {
              firstName: firstNameEl.value,
              lastName: lastNameEl.value,
              phone: phoneEl.value,
              email: emailEl.value,
              location: locationEl.value,
            };

            // Reset form (clears all fields)
            orderForm.reset();

            // Restore user data
            firstNameEl.value = savedUserData.firstName;
            lastNameEl.value = savedUserData.lastName;
            phoneEl.value = savedUserData.phone;
            emailEl.value = savedUserData.email;
            locationEl.value = savedUserData.location;

            // Clear order items and add new item
            const itemsDiv = document.getElementById("items");
            itemsDiv.innerHTML = "";
            addItem();
            document.getElementById("result").textContent =
              translations.orderSuccess[currentLang];
            calculateTotal();
          } else {
            alert(translations.orderFailed[currentLang]);
          }
        } catch (error) {
          alert(translations.errorOccurred[currentLang]);
        } finally {
          // Restore buttons and hide spinner
          modalFooterButtons.style.display = "flex";
          modalFooterSpinner.classList.add("hidden");
          modalCloseBtn.disabled = false;
          modalCloseBtn.style.pointerEvents = "auto";
          modalCloseBtn.style.opacity = "1";
          pendingOrderData = null;
        }
      }

      document
        .getElementById("orderForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const items = [...document.querySelectorAll("#items .row")].map(
            (row) => {
              const select = row.querySelector("select");
              const qty = Number(row.querySelector("input").value);
              const bread = breadTypes.find((b) => b.id === select.value);

              return {
                breadId: bread.id,
                breadName: bread.name,
                quantity: qty,
                unitPrice: bread.price,
                total: bread.price * qty,
              };
            }
          );

          const payload = {
            customer: {
              firstName: firstName.value,
              lastName: lastName.value,
              phone: phone.value,
              email: email.value || null,
            },
            items,
            totalPrice: Number(totalPrice.textContent),
            submittedAt: new Date().toISOString(),
            location: document.getElementById("location").value,
            remark: document.getElementById("remark").value || null,
          };

          // Save customer info to localStorage
          const customerInfo = {
            firstName: firstNameEl.value,
            lastName: lastNameEl.value,
            email: emailEl.value || "",
            phone: phoneEl.value,
            location: locationEl.value,
          };
          localStorage.setItem("bakery-order", JSON.stringify(customerInfo));

          pendingOrderData = payload;
          showConfirmationModal(payload);
        });

      function loadCustomerInfoFromStorage() {
        const stored = localStorage.getItem("bakery-order");
        if (stored) {
          try {
            const customerInfo = JSON.parse(stored);

            if (customerInfo.firstName) {
              firstNameEl.value = customerInfo.firstName;
            }

            if (customerInfo.lastName) {
              lastNameEl.value = customerInfo.lastName;
            }

            if (customerInfo.email) {
              emailEl.value = customerInfo.email;
            }

            if (customerInfo.phone) {
              phoneEl.value = customerInfo.phone;
            }

            if (customerInfo.location) {
              locationEl.value = customerInfo.location;
            }
          } catch (error) {
            console.error(
              "Error loading customer info from localStorage:",
              error
            );
          }
        }
      }

      (async function init() {
        await loadBreadTypes();
        document.getElementById("loadingSpinner").classList.add("hidden");
        document.getElementById("items").classList.remove("hidden");
        loadCustomerInfoFromStorage();
        addItem();
        updateSubmitButtonState();
      })();
    </script>
  </body>
</html>
